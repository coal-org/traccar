# =============================================================================
# TRACCAROCRA - Configuración HTTP TEMPORAL (para generación de certificados SSL)
# =============================================================================
# IMPORTANTE: Esta configuración es temporal. Después de generar los certificados
# SSL, reemplazar con traccarocra.conf (versión HTTPS)
# =============================================================================

# -----------------------------------------------------------------------------
# DESARROLLO - HTTP
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name dev-avl.ocraplus.coal.mx;

    # ACME Challenge para Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Proxy a Traccar desarrollo
    location / {
        proxy_pass http://traccarocra_dev_app:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebSocket para actualizaciones en tiempo real
    location /api/socket {
        proxy_pass http://traccarocra_dev_app:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }
}

