# =============================================================================
# TRACCAROCRA - Configuración HTTPS DESARROLLO
# =============================================================================

# -----------------------------------------------------------------------------
# DESARROLLO - HTTPS
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name dev-avl.ocraplus.coal.mx;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/dev-avl.ocraplus.coal.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-avl.ocraplus.coal.mx/privkey.pem;

    # SSL Configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Proxy a Traccar desarrollo
    location / {
        proxy_pass http://traccarocra_dev_app:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # WebSocket para actualizaciones en tiempo real
    location /api/socket {
        proxy_pass http://traccarocra_dev_app:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }
}

# DESARROLLO - HTTP redirect a HTTPS
server {
    listen 80;
    server_name dev-avl.ocraplus.coal.mx;

    # ACME Challenge para renovación de certificados
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect a HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}
